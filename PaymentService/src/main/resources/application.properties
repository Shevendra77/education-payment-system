spring.application.name=PaymentService
server.port=8080

spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=jdbc:mysql://127.0.0.1:3308/payment_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.spring.json.type.mapping=enrollment:com.cfs.PaymentService.model.EnrollmentNotification

app.razorpay.api.key-id=${RAZORPAY_KEY_ID}
app.razorpay.api.key-secret=${RAZORPAY_KEY_SECRET}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.kafka.topic=course-enrollment-notification

app.cors.allowed-origin-patterns=http://127.0.0.1:5500,http://localhost:*,null